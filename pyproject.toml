[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yasir-agdo-mt"
version = "1.0.0"
description = "A Python library for one-dimensional magnetotelluric inversion using the Adam Gradient Descent Optimizer (AGDO)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Muhammad Fadhilah Al Yasir Harahap", email = "alyasirharahap@gmail.com" }
]

keywords = [
    "magnetotellurics",
    "geophysics",
    "inversion",
    "optimization",
    "AGDO",
    "electromagnetics",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/<USERNAME>/AGDO-MT-Inversion"
Repository = "https://github.com/<USERNAME>/AGDO-MT-Inversion"
Issues = "https://github.com/<USERNAME>/AGDO-MT-Inversion/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["yasir_agdo_mt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]